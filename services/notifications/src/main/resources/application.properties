# Porta do servico
server.port=8084

# Nome da aplicacao
spring.application.name=notifications

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.connection-timeout=10000

# Banco de Dados SQLite (arquivo local persistido em ./data/notifications.db)
spring.datasource.url=jdbc:sqlite:./data/notifications.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate para SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Topologia de Mensageria - Exchanges
rabbitmq.exchange.events=events.topic
rabbitmq.exchange.payments=payments.fanout

# Topologia de Mensageria - Filas
rabbitmq.queue.events=notifications.events.queue
rabbitmq.queue.payment=notif.payment-confirmed.queue
rabbitmq.queue.checkin=notif.checkin.queue
rabbitmq.queue.soldout=notif.soldout.queue

# Routing Keys
rabbitmq.routing.event-created=event.created
rabbitmq.routing.ticket-checked=ticket.checked
rabbitmq.routing.event-soldout=event.soldout

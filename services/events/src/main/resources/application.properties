spring.application.name=events
server.port=8081

# RabbitMQ (Docker Local)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin
spring.rabbitmq.connection-timeout=10000

# SQLite
spring.datasource.url=jdbc:sqlite:./data/events.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Exchanges e routing keys
rabbitmq.exchange.events=events.topic
rabbitmq.routing.event-created=event.created
rabbitmq.routing.ticket-checked=ticket.checked
rabbitmq.routing.event-soldout=event.soldout
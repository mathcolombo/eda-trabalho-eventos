server.port=8082
spring.application.name=tickets

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}

spring.datasource.url=jdbc:sqlite:./data/tickets.db?journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Exchanges e routing keys
rabbitmq.exchange.events=events.topic
rabbitmq.exchange.tickets=tickets.direct
rabbitmq.exchange.payments=payments.fanout
rabbitmq.routing.event-created=event.created
rabbitmq.routing.ticket-purchased=ticket.purchased
rabbitmq.routing.ticket-checked=ticket.checked
rabbitmq.routing.event-soldout=event.soldout
rabbitmq.queue.event-created=tickets.event-create.queue
rabbitmq.queue.payment-confirmed=tickets.payment-confirmed.queue